<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Simpan Nama</title>
</head>
<body>
    <h2>Masukkan Nama Pengguna</h2>
    <form id="userForm">
        <input type="text" id="usernameInput" placeholder="Masukkan nama Anda" required>
        <button type="submit">Simpan</button>
    </form>

    <button id="deleteButton">Hapus</button>
    
    <h3 id="message"></h3>
    <h4 id="status"></h4>

    <script>
        // Fungsi untuk menampilkan nama yang tersimpan atau pesan jika tidak ada data
        function displayUsername() {
            const savedName = localStorage.getItem("username");
            const messageElement = document.getElementById("message");
            const statusElement = document.getElementById("status");

            if (savedName) {
                messageElement.textContent = `Nama yang disimpan: ${savedName}`;
                statusElement.textContent = "Nama pengguna tersedia di penyimpanan.";
            } else {
                messageElement.textContent = "Belum ada nama yang disimpan.";
                statusElement.textContent = "Tidak ada nama pengguna di penyimpanan.";
            }
        }

        // Menampilkan nama saat halaman dimuat
        document.addEventListener("DOMContentLoaded", displayUsername);

        // Menangani form submission untuk menyimpan nama
        document.getElementById("userForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const username = document.getElementById("usernameInput").value;
            localStorage.setItem("username", username);
            displayUsername(); // Update pesan setelah menyimpan nama
            document.getElementById("usernameInput").value = ""; // Reset input
        });

        // Menangani tombol hapus untuk menghapus nama
        document.getElementById("deleteButton").addEventListener("click", function() {
            localStorage.removeItem("username");
            displayUsername(); // Update pesan setelah menghapus nama
            document.getElementById("message").textContent = "Username dihapus.";
        });
    </script>
</body>
</html>
