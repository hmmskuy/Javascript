<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba event</title>
    <style>
        .buttons {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          padding: 15px;
        }
        .button {
          margin: 8px;
          height: 40px;
        }
    </style>
</head>
<body>
    <!-- Membuat custom event -->
    <div class="buttons" align="center">
        <h3 id="caption">Silakan tekan salah satu tombol di bawah...</h3>
        <button class="button" id="tombol">Tombol Custom Event</button>
    </div>
    
    <script>
        // Custom event untuk mengubah caption
        const changeCaption = new Event('changeCaption');
       
        // Menunggu halaman selesai dimuat
        window.addEventListener('load', function() {
          const tombol = document.getElementById('tombol');
          
          // Tambahkan event listener untuk custom event
          tombol.addEventListener('changeCaption', customEventHandler);
          
          // Memicu custom event ketika tombol diklik
          tombol.addEventListener('click', function() {
            tombol.dispatchEvent(changeCaption); // Memicu event custom 'changeCaption'
          });
        });
       
        // Handler untuk custom event
        function customEventHandler(ev) {
          console.log('Event ' + ev.type + ' telah dijalankan');
          const caption = document.getElementById('caption');
          caption.innerText = 'Anda telah membangkitkan custom event';
        }
    </script>
    
</body>
</html>
