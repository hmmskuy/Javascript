<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Event</title>
</head>
<body>
    <!-- Soal 1 START  -->
    <h1>Contoh Tombol dengen Event Listener</h1>
    <button id="myButton">Klick Saya!</button>
    <script>
        const button = documen.getElementById("myButton");
        button.addEventListener("click", function () {
            alert("Tombol telah diklik!");

        });
    </script>
    <!-- Soal 1 END  -->
</body>
</html>
